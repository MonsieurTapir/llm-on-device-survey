# Build the benchmark report from results/published/ and deploy it as the
# GitHub Pages site on every push to main. The report is never committed:
# each merge triggers a fresh build over all submissions, so submission PRs
# only ever add their own folder and can land in parallel.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Build the report as the site root
        # Always built fresh over results/published/ (empty-state page when
        # no submission has landed yet).
        run: |
          mkdir -p _site
          uv run --project analysis python -m bench_analysis.site --out _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
